name: build

on:
  push:
  pull_request:

jobs:
  openwrt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenWrt build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget
      - name: Prepare pinned source and apply patches
        run: ./scripts/prepare-source.sh "$GITHUB_WORKSPACE/openwrt-25.12"
      - name: Build images
        run: JOBS="$(nproc)" ./scripts/build.sh "$GITHUB_WORKSPACE/openwrt-25.12"
      - name: Publish generated images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-kn-4010
          path: openwrt-25.12/bin/targets/mediatek/filogic/*keenetic_kn-4010*.bin
          if-no-files-found: error
